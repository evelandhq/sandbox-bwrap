name: eve drift

# The peer range's ceiling (`<1.0.0`) accepts eve releases that did not exist
# when this package was published, so no pinned devDependency can verify it.
# This job is what makes that range a maintained claim instead of an
# unfalsifiable one: it installs whatever eve is newest today and re-runs the
# suite, so a breaking 0.x minor surfaces here first.

on:
  schedule:
    # Mondays 03:17 UTC. Off the hour to avoid GitHub's scheduling backlog.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  latest-eve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the newest eve
        id: eve
        run: echo "version=$(npm view eve version)" >> "$GITHUB_OUTPUT"

      # Deliberately not --frozen-lockfile and deliberately not committed: this
      # job asks "does today's eve still work", it does not change what the
      # package ships.
      - name: Install eve@${{ steps.eve.outputs.version }}
        run: pnpm add -D "eve@${{ steps.eve.outputs.version }}" --no-frozen-lockfile

      - name: Typecheck against the newest eve
        run: pnpm typecheck

      - name: Test against the newest eve
        run: pnpm test

      - name: Open an issue when the newest eve breaks the contract
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ steps.eve.outputs.version }}";
            const title = `eve ${version} breaks the SandboxBackend contract`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "eve-drift",
            });
            if (existing.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["eve-drift"],
              body: [
                `The scheduled drift check failed against \`eve@${version}\`, which the`,
                "declared peer range `>=0.27.0 <1.0.0` currently accepts.",
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "Either adapt the backend to the new eve, or narrow the peer range's",
                "ceiling and cut a release so consumers stop resolving a version that",
                "does not work.",
              ].join("\n"),
            });
